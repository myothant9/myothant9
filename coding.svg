@keyframes k5{0%,29.791%{opacity:0}29.801%,45.778%{opacity:1}45.788%,100%{opacity:0}}
@keyframes c7{0%,45.778%{transform:translateX(0);animation-timing-function:steps(18,end)}50.474%,97%{transform:translateX(162px)}97.01%,100%{transform:translateX(0)}}
@keyframes k7{0%,45.778%{opacity:0}45.788%,51.898%{opacity:1}51.908%,100%{opacity:0}}
@keyframes c8{0%,51.898%{transform:translateX(0);animation-timing-function:steps(1,end)}52.158%,97%{transform:translateX(9px)}97.01%,100%{transform:translateX(0)}}
