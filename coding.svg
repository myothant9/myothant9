    <path d="M152 156 Q160 161 168 156" stroke="#9b5a3c" stroke-width="2" fill="none"/>
    <path d="M128 140 Q120 140 122 150" stroke="#86A8E7" stroke-width="5" fill="none"/>
    <rect x="117" y="146" width="9" height="14" rx="4" fill="#86A8E7"/>
  </g>
