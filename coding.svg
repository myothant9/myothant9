<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-label="Animated coder typing C# code">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F2027"/><stop offset="0.5" stop-color="#203A43"/><stop offset="1" stop-color="#2C5364"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#91EAE4" stop-opacity=".45"/><stop offset="1" stop-color="#91EAE4" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ed"><rect x="332" y="62" width="634" height="298"/></clipPath>
    <style>
      text{font-family:Consolas,'Courier New',monospace;font-size:15px}
      .k{fill:#86A8E7}.t{fill:#91EAE4}.s{fill:#F7C873}.m{fill:#C3A6FF}.p{fill:#E6F1F3}
      .ln{fill:#4f6f78;font-size:13px}
      .cur{fill:#91EAE4;animation:blink 1s steps(1) infinite}
      .ui{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;fill:#9fc3ca}
      .arm1{animation:typeA .28s ease-in-out infinite}
      .arm2{animation:typeA .28s ease-in-out .14s infinite}
      .head{animation:bob 2.4s ease-in-out infinite}
      .float{animation:float 4s ease-in-out infinite}.f2{animation-delay:1.3s}.f3{animation-delay:2.6s}
      .screen{animation:flick 1.8s ease-in-out infinite}
      .steam{animation:steam 2.5s ease-out infinite}.st2{animation-delay:1.2s}
      @keyframes blink{50%{opacity:0}}
      @keyframes typeA{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
      @keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(2px) rotate(-1.5deg)}}
      @keyframes float{0%,100%{transform:translateY(0);opacity:.35}50%{transform:translateY(-12px);opacity:.9}}
      @keyframes flick{0%,100%{opacity:.85}50%{opacity:1}}
      @keyframes steam{0%{transform:translateY(0);opacity:0}30%{opacity:.7}100%{transform:translateY(-22px);opacity:0}}
