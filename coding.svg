  <line x1="330" y1="362" x2="970" y2="362" stroke="#2C5364" stroke-width="1.5"/>
  <text x="350" y="384" class="ui">TERMINAL</text>
  <g style="animation:term 21.08s infinite"><text x="430" y="384"><tspan class="t">&gt; dotnet run</tspan><tspan class="p">   Building cool things...</tspan><tspan class="s"> ✔</tspan></text></g>
