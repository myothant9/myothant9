@keyframes k10{0%,60.223%{opacity:0}60.233%,73.387%{opacity:1}73.397%,100%{opacity:0}}
@keyframes c11{0%,73.387%{transform:translateX(0);animation-timing-function:steps(1,end)}73.648%,97%{transform:translateX(9px)}97.01%,100%{transform:translateX(0)}}
@keyframes k11{0%,73.387%{opacity:0}73.397%,75.071%{opacity:1}75.081%,100%{opacity:0}}
@keyframes c12{0%,75.071%{transform:translateX(0);animation-timing-function:steps(1,end)}75.332%,97%{transform:translateX(9px)}97.01%,100%{transform:translateX(0)}}
@keyframes k12{0%,75.071%{opacity:0}75.081%,78.653%{opacity:1}78.663%,100%{opacity:0}}
@keyframes code{0%{opacity:1}93%{opacity:1}97%{opacity:0}97.01%,100%{opacity:1}}
@keyframes term{0%,78.653%{opacity:0}80.076%,93%{opacity:1}97%,100%{opacity:0}}
