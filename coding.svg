  </defs>
  <rect width="1000" height="420" rx="18" fill="url(#bg)"/>

  <!-- floating symbols -->
  <text x="40" y="70" class="float t" style="font-size:22px">&lt;/&gt;</text>
  <text x="250" y="60" class="float f2 m" style="font-size:22px">{ }</text>
  <text x="270" y="300" class="float f3 s" style="font-size:20px">C#</text>

  <!-- coder at a laptop -->
  <ellipse cx="160" cy="215" rx="130" ry="110" fill="url(#glow)"/>
  <g class="head" style="transform-origin:160px 175px">
    <rect x="128" y="168" width="64" height="70" rx="26" fill="#2C5364"/>
    <circle cx="160" cy="140" r="30" fill="#f2c9a0"/>
    <path d="M130 136 Q132 106 160 106 Q190 106 190 136 Q178 122 160 124 Q142 122 130 136Z" fill="#1d2b30"/>
