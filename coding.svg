  <text x="413" y="178" textLength="360" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan class="k">public string</tspan><tspan class="p"> Name </tspan><tspan class="p">=&gt;</tspan><tspan class="s"> "Myo Thant Naing"</tspan><tspan class="p">;</tspan></text>
  <g style="animation:c4 21.08s infinite"><rect x="413" y="163" width="372" height="20" fill="#0b1a20"/><g style="animation:k4 21.08s infinite"><rect class="cur" x="413" y="164" width="2.5" height="17"/></g></g>
  <text x="413" y="198" textLength="486" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan class="k">public string</tspan><tspan class="p">[] Stack </tspan><tspan class="p">=&gt;</tspan><tspan class="p"> new[] { </tspan><tspan class="s">"C#"</tspan><tspan class="p">, </tspan><tspan class="s">".NET"</tspan><tspan class="p">, </tspan><tspan class="s">"AI"</tspan><tspan class="p"> };</tspan></text>
  <g style="animation:c5 21.08s infinite"><rect x="413" y="183" width="498" height="20" fill="#0b1a20"/><g style="animation:k5 21.08s infinite"><rect class="cur" x="413" y="184" width="2.5" height="17"/></g></g>
  <text x="413" y="238" textLength="162" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan class="k">public void</tspan><tspan class="m"> Code</tspan><tspan class="p">()</tspan></text>
  <g style="animation:c7 21.08s infinite"><rect x="413" y="223" width="174" height="20" fill="#0b1a20"/><g style="animation:k7 21.08s infinite"><rect class="cur" x="413" y="224" width="2.5" height="17"/></g></g>
  <text x="413" y="258" textLength="9" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan class="p">{</tspan></text>
  <g style="animation:c8 21.08s infinite"><rect x="413" y="243" width="21" height="20" fill="#0b1a20"/><g style="animation:k8 21.08s infinite"><rect class="cur" x="413" y="244" width="2.5" height="17"/></g></g>
  <text x="431" y="278" textLength="180" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan class="k">while</tspan><tspan class="p"> (coffee.</tspan><tspan class="m">IsHot</tspan><tspan class="p">)</tspan></text>
  <g style="animation:c9 21.08s infinite"><rect x="431" y="263" width="192" height="20" fill="#0b1a20"/><g style="animation:k9 21.08s infinite"><rect class="cur" x="431" y="264" width="2.5" height="17"/></g></g>
  <text x="449" y="298" textLength="405" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan class="t">Console</tspan><tspan class="p">.</tspan><tspan class="m">WriteLine</tspan><tspan class="p">(</tspan><tspan class="s">"Building cool things..."</tspan><tspan class="p">);</tspan></text>
  <g style="animation:c10 21.08s infinite"><rect x="449" y="283" width="417" height="20" fill="#0b1a20"/><g style="animation:k10 21.08s infinite"><rect class="cur" x="449" y="284" width="2.5" height="17"/></g></g>
  <text x="413" y="318" textLength="9" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan class="p">}</tspan></text>
  <g style="animation:c11 21.08s infinite"><rect x="413" y="303" width="21" height="20" fill="#0b1a20"/><g style="animation:k11 21.08s infinite"><rect class="cur" x="413" y="304" width="2.5" height="17"/></g></g>
  <text x="395" y="338" textLength="9" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan class="p">}</tspan></text>
  <g style="animation:c12 21.08s infinite"><rect x="395" y="323" width="21" height="20" fill="#0b1a20"/><g style="animation:k12 21.08s infinite"><rect class="cur" x="395" y="324" width="2.5" height="17"/></g></g>
