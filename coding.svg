  <g class="arm1"><path d="M135 200 Q110 260 130 296" stroke="#2C5364" stroke-width="14" fill="none" stroke-linecap="round"/><circle cx="131" cy="297" r="8" fill="#f2c9a0"/></g>
  <g class="arm2"><path d="M185 200 Q205 260 190 296" stroke="#2C5364" stroke-width="14" fill="none" stroke-linecap="round"/><circle cx="189" cy="297" r="8" fill="#f2c9a0"/></g>
