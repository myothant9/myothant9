  <text x="160" y="263" text-anchor="middle" style="font-family:'Segoe UI',Arial,sans-serif;font-size:16px;font-weight:700;fill:#91EAE4">C#</text>
  <!-- desk + coffee -->
  <rect x="20" y="312" width="290" height="10" rx="5" fill="#16303a"/>
  <rect x="262" y="286" width="24" height="26" rx="4" fill="#E6F1F3"/>
  <path d="M286 292 q10 0 10 8 q0 8 -10 8" stroke="#E6F1F3" stroke-width="3" fill="none"/>
  <path class="steam" d="M268 280 q-5 -8 0 -16" stroke="#E6F1F3" stroke-width="2" fill="none"/>
  <path class="steam st2" d="M279 280 q5 -8 0 -16" stroke="#E6F1F3" stroke-width="2" fill="none"/>
  <text x="165" y="352" text-anchor="middle" class="ui">typing<tspan class="dots">...</tspan></text>

  <!-- editor window -->
