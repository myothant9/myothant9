  <path d="M92 298 L228 298 L240 312 L80 312Z" fill="#9fb7bd"/>
  <rect x="96" y="214" width="128" height="86" rx="8" fill="#c9d8dc"/>
  <rect x="96" y="214" width="128" height="86" rx="8" fill="none" stroke="#9fb7bd" stroke-width="2"/>
