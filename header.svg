<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F2027"/>
      <stop offset="0.5" stop-color="#203A43"/>
      <stop offset="1" stop-color="#2C5364"/>
    </linearGradient>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#91EAE4"/>
    </linearGradient>
    <style>
      .name{font:700 52px 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:url(#t);opacity:0;animation:fade 1.2s ease-out .2s forwards}
      .sub{font:500 20px 'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#cfe8ec;letter-spacing:2px;opacity:0;animation:fade 1.2s ease-out .8s forwards}
      .w1{animation:wave 8s ease-in-out infinite}
      .w2{animation:wave 11s ease-in-out infinite reverse}
      .dot{fill:#91EAE4;animation:blink 3s ease-in-out infinite}
      .d2{animation-delay:1s}.d3{animation-delay:2s}
      @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
      @keyframes wave{0%,100%{transform:translateX(0)}50%{transform:translateX(-60px)}}
      @keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
    </style>
  </defs>
  <rect width="1000" height="220" fill="url(#g)"/>
  <g opacity=".18" class="w1"><path d="M0 170 Q 125 140 250 170 T 500 170 T 750 170 T 1000 170 T 1250 170 V220 H0Z" fill="#91EAE4"/></g>
  <g opacity=".12" class="w2"><path d="M0 185 Q 125 160 250 185 T 500 185 T 750 185 T 1000 185 T 1250 185 V220 H0Z" fill="#86A8E7"/></g>
  <circle class="dot" cx="80" cy="50" r="3"/><circle class="dot d2" cx="920" cy="60" r="3"/><circle class="dot d3" cx="860" cy="35" r="2"/>
  <text x="500" y="105" text-anchor="middle" class="name">Myo Thant Naing</text>
  <text x="500" y="145" text-anchor="middle" class="sub">DEVELOPER · AI &amp; AUTOMATION</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
