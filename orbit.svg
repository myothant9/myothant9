<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="animated night sky with orbiting planets" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1520"/>
      <stop offset="0.6" stop-color="#14303C"/>
      <stop offset="1" stop-color="#203A43"/>
    </linearGradient>
    <radialGradient id="sun">
      <stop offset="0" stop-color="#FFF6C9"/>
      <stop offset="0.5" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#FF9F43" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" x2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <style>
      .tw  { animation: tw 3s ease-in-out infinite; }
      .t2 { animation-delay: .7s; } .t3 { animation-delay: 1.4s; } .t4 { animation-delay: 2.1s; }
      .o1 { transform-origin: 450px 130px; animation: spin 8s linear infinite; }
      .o2 { transform-origin: 450px 130px; animation: spin 14s linear infinite reverse; }
      .o3 { transform-origin: 450px 130px; animation: spin 22s linear infinite; }
      .moon { transform-origin: 610px 130px; animation: spin 3s linear infinite; }
      .pulse { transform-origin: 450px 130px; animation: pulse 3s ease-in-out infinite; }
      .shoot { animation: shoot 6s ease-in infinite; }
      .s2 { animation-delay: 3s; }
      @keyframes tw { 0%,100% { opacity: .2; } 50% { opacity: 1; } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
      @keyframes shoot { 0% { transform: translate(0,0); opacity: 0; } 5% { opacity: 1; } 25% { transform: translate(-260px,130px); opacity: 0; } 100% { transform: translate(-260px,130px); opacity: 0; } }
    </style>
  </defs>

  <rect width="900" height="260" rx="16" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#fff">
    <circle class="tw"    cx="60"  cy="40"  r="1.6"/><circle class="tw t2" cx="140" cy="200" r="1.2"/>
    <circle class="tw t3" cx="220" cy="80"  r="1.8"/><circle class="tw t4" cx="300" cy="30"  r="1.2"/>
    <circle class="tw t2" cx="680" cy="40"  r="1.5"/><circle class="tw"    cx="760" cy="190" r="1.8"/>
    <circle class="tw t3" cx="830" cy="70"  r="1.2"/><circle class="tw t4" cx="870" cy="220" r="1.5"/>
    <circle class="tw"    cx="100" cy="120" r="1"/>  <circle class="tw t3" cx="790" cy="120" r="1"/>
    <circle class="tw t2" cx="380" cy="230" r="1.2"/><circle class="tw t4" cx="540" cy="25"  r="1.2"/>
  </g>

  <!-- shooting stars -->
  <g class="shoot"><line x1="840" y1="20" x2="890" y2="-5" stroke="url(#trail)" stroke-width="2" stroke-linecap="round"/></g>
  <g class="shoot s2"><line x1="380" y1="15" x2="430" y2="-10" stroke="url(#trail)" stroke-width="2" stroke-linecap="round"/></g>

  <!-- orbits -->
  <g fill="none" stroke="#91EAE4" stroke-opacity=".18">
    <circle cx="450" cy="130" r="60"/><circle cx="450" cy="130" r="100"/><circle cx="450" cy="130" r="160" stroke-dasharray="4 6"/>
  </g>

  <!-- sun -->
  <g class="pulse">
    <circle cx="450" cy="130" r="42" fill="url(#sun)"/>
    <circle cx="450" cy="130" r="20" fill="#FFD166"/>
  </g>

  <!-- planets -->
  <g class="o1"><circle cx="510" cy="130" r="7" fill="#91EAE4"/></g>
  <g class="o2">
    <circle cx="550" cy="130" r="11" fill="#7FB8FF"/>
  </g>
  <g class="o3">
    <g>
      <circle cx="610" cy="130" r="9" fill="#C3A6FF"/>
      <ellipse cx="610" cy="130" rx="16" ry="5" fill="none" stroke="#E5D9FF" stroke-width="2"/>
      <g class="moon"><circle cx="628" cy="130" r="3" fill="#fff"/></g>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
