<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="An AI robot petting an orange cat" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F2027"/>
      <stop offset="0.5" stop-color="#203A43"/>
      <stop offset="1" stop-color="#2C5364"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8F6F8"/>
      <stop offset="1" stop-color="#9FC3CC"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1A20"/>
      <stop offset="1" stop-color="#16323C"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB04D"/>
      <stop offset="1" stop-color="#F08A24"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#91EAE4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#91EAE4" stop-opacity="0"/>
    </radialGradient>
    <path id="heart" d="M0 3 C0 -1 -6 -1 -6 3 C-6 7 0 10 0 12 C0 10 6 7 6 3 C6 -1 0 -1 0 3 Z"/>
    <style>
      .pet   { transform-origin: 204px 180px; animation: pet 1.4s ease-in-out infinite; }
      .chead { transform-origin: 305px 175px; animation: lean 1.4s ease-in-out infinite; }
      .tail  { transform-origin: 340px 250px; animation: swish 2.2s ease-in-out infinite; }
      .ear   { transform-box: fill-box; transform-origin: bottom center; animation: twitch 5s ease-in-out infinite; }
      .eye   { transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }
      .ant   { animation: pulse 1.2s ease-in-out infinite; }
      .heart { transform-box: fill-box; transform-origin: center; animation: float 3s ease-in infinite; opacity: 0; }
      .h2 { animation-delay: 1s; } .h3 { animation-delay: 2s; }
      .line  { stroke-dasharray: 200; stroke-dashoffset: 200; animation: type 6s linear infinite; }
      .l2 { animation-delay: .8s; } .l3 { animation-delay: 1.6s; } .l4 { animation-delay: 2.4s; }
      .caret { animation: caret 1s steps(1) infinite; }
      .title { font: 700 30px 'Segoe UI', Inter, Arial, sans-serif; fill: #FFFFFF; }
      .sub   { font: 500 14px 'Segoe UI', Inter, Arial, sans-serif; fill: #91EAE4; letter-spacing: 3px; }
      @keyframes pet    { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(4deg); } }
      @keyframes lean   { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(3deg); } }
      @keyframes swish  { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(10deg); } }
      @keyframes twitch { 0%,90%,100% { transform: rotate(0); } 93% { transform: rotate(-12deg); } 96% { transform: rotate(6deg); } }
      @keyframes blink  { 0%,44%,50%,100% { transform: scaleY(1); } 47% { transform: scaleY(0.1); } }
      @keyframes pulse  { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes float  { 0% { opacity: 0; transform: translate(0,0) scale(.6); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(10px,-50px) scale(1.1); } }
      @keyframes type   { 0% { stroke-dashoffset: 200; } 15%,80% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; opacity: 0; } }
      @keyframes caret  { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="900" height="300" rx="16" fill="url(#bg)"/>

  <!-- background dots -->
  <g fill="#91EAE4" opacity=".25">
    <circle cx="60" cy="50" r="2"/><circle cx="400" cy="36" r="2"/><circle cx="850" cy="56" r="2"/>
    <circle cx="430" cy="270" r="2"/><circle cx="866" cy="250" r="2"/><circle cx="30" cy="230" r="2"/>
  </g>

  <!-- floor shadows -->
  <ellipse cx="150" cy="270" rx="66" ry="7" fill="#000" opacity=".3"/>
  <ellipse cx="315" cy="270" rx="56" ry="7" fill="#000" opacity=".3"/>

  <!-- ===== Cat ===== -->
  <g>
    <!-- tail -->
    <g class="tail">
      <path d="M335 252 C385 250 392 210 372 190" stroke="url(#fur)" stroke-width="13" fill="none" stroke-linecap="round"/>
      <path d="M379 205 l9 -3 M384 222 l9 1" stroke="#D2701A" stroke-width="4" stroke-linecap="round"/>
    </g>
    <!-- body -->
    <ellipse cx="310" cy="228" rx="44" ry="40" fill="url(#fur)"/>
    <ellipse cx="305" cy="236" rx="22" ry="27" fill="#FFE3B8"/>
    <path d="M338 205 q8 6 6 16 M342 230 q6 6 3 14" stroke="#D2701A" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- paws -->
    <ellipse cx="292" cy="264" rx="11" ry="6" fill="#FFE3B8"/>
    <ellipse cx="320" cy="264" rx="11" ry="6" fill="#FFE3B8"/>

    <!-- head (leans into the hand) -->
    <g class="chead">
      <path class="ear" d="M281 146 L285 116 L304 136 Z" fill="#F08A24"/>
      <path class="ear" d="M329 146 L325 116 L306 136 Z" fill="#F08A24"/>
      <path d="M285 141 L287 124 L297 135 Z M325 141 L323 124 L313 135 Z" fill="#FFB7A8"/>
      <circle cx="305" cy="162" r="33" fill="url(#fur)"/>
      <path d="M298 131 v9 M305 129 v11 M312 131 v9" stroke="#D2701A" stroke-width="3.5" stroke-linecap="round"/>
      <!-- happy closed eyes -->
      <path d="M287 160 q7 -7 14 0 M309 160 q7 -7 14 0" stroke="#3A2414" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <!-- blush -->
      <ellipse cx="285" cy="172" rx="6" ry="3.5" fill="#FF8A80" opacity=".6"/>
      <ellipse cx="325" cy="172" rx="6" ry="3.5" fill="#FF8A80" opacity=".6"/>
      <!-- nose + mouth -->
      <path d="M301 169 h8 l-4 4 Z" fill="#E86A6A"/>
      <path d="M305 173 q-4 6 -9 3 M305 173 q4 6 9 3" stroke="#3A2414" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <!-- whiskers -->
      <path d="M278 170 h-16 M279 176 l-15 4 M332 170 h16 M331 176 l15 4" stroke="#FFF3E0" stroke-width="2" stroke-linecap="round" opacity=".9"/>
    </g>
  </g>

  <!-- hearts -->
  <g fill="#FF8FA3">
    <g transform="translate(350 118)"><use href="#heart" class="heart"/></g>
    <g transform="translate(334 104)"><use href="#heart" class="heart h2"/></g>
    <g transform="translate(364 130)"><use href="#heart" class="heart h3"/></g>
  </g>

  <!-- ===== Robot ===== -->
  <g>
    <line x1="150" y1="58" x2="150" y2="36" stroke="#9FC3CC" stroke-width="4"/>
    <circle cx="150" cy="30" r="16" fill="url(#glow)" class="ant"/>
    <circle cx="150" cy="30" r="7" fill="#91EAE4"/>

    <rect x="90" y="58" width="120" height="86" rx="26" fill="url(#metal)"/>
    <rect x="78" y="88" width="14" height="28" rx="6" fill="#7FA8B2"/>
    <rect x="208" y="88" width="14" height="28" rx="6" fill="#7FA8B2"/>
    <rect x="104" y="74" width="92" height="54" rx="18" fill="url(#visor)"/>
    <rect class="eye" x="126" y="90" width="16" height="22" rx="8" fill="#91EAE4"/>
    <rect class="eye" x="166" y="90" width="16" height="22" rx="8" fill="#91EAE4"/>
    <path d="M138 118 Q152 127 166 118" stroke="#91EAE4" stroke-width="3" fill="none" stroke-linecap="round"/>

    <rect x="138" y="144" width="24" height="12" fill="#7FA8B2"/>
    <rect x="98" y="154" width="104" height="90" rx="22" fill="url(#metal)"/>
    <rect x="122" y="172" width="56" height="40" rx="10" fill="url(#visor)"/>
    <path d="M142 186 c0 -5 -7 -5 -7 0 c0 5 7 8 7 10 c0 -2 7 -5 7 -10 c0 -5 -7 -5 -7 0 Z" fill="#FF8FA3" class="ant"/>
    <rect x="154" y="186" width="16" height="4" rx="2" fill="#91EAE4" opacity=".7"/>
    <rect x="154" y="195" width="11" height="4" rx="2" fill="#91EAE4" opacity=".5"/>

    <rect x="74" y="164" width="22" height="58" rx="11" fill="#B9D6DD"/>
    <circle cx="85" cy="228" r="11" fill="#9FC3CC"/>

    <rect x="116" y="242" width="22" height="18" rx="6" fill="#7FA8B2"/>
    <rect x="162" y="242" width="22" height="18" rx="6" fill="#7FA8B2"/>

    <!-- right arm: pets the cat's head -->
    <g transform="rotate(-24 204 180)">
      <g class="pet">
        <rect x="200" y="170" width="112" height="20" rx="10" fill="#B9D6DD"/>
        <circle cx="204" cy="180" r="10" fill="#9FC3CC"/>
        <ellipse cx="318" cy="180" rx="14" ry="12" fill="#9FC3CC"/>
        <path d="M314 168 v-4 M322 168 v-4" stroke="#7FA8B2" stroke-width="3" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <!-- text -->
  <text x="440" y="86" class="title">Hello, I'm NAING</text>
  <text x="442" y="113" class="sub">AI · CODE · CATS</text>

  <!-- code window -->
  <g transform="translate(440 136)">
    <rect width="410" height="118" rx="12" fill="#0B1A20" opacity=".85" stroke="#2C5364"/>
    <circle cx="18" cy="16" r="5" fill="#FF5F56"/><circle cx="36" cy="16" r="5" fill="#FFBD2E"/><circle cx="54" cy="16" r="5" fill="#27C93F"/>
    <g stroke-width="7" stroke-linecap="round" fill="none">
      <path class="line"    d="M24 44 H180" stroke="#91EAE4"/>
      <path class="line l2" d="M44 64 H230" stroke="#7FB8FF"/>
      <path class="line l3" d="M44 84 H200" stroke="#FFB04D"/>
      <path class="line l4" d="M24 102 H120" stroke="#C3A6FF"/>
    </g>
    <rect class="caret" x="380" y="94" width="10" height="14" fill="#91EAE4"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
